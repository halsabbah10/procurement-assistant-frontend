name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      # Plain `tsc --noEmit` is a silent no-op here: this repo's root
      # tsconfig.json is solution-style ("files": [], only "references"),
      # so it type-checks nothing and exits 0 regardless of real errors.
      # `-b` makes it follow the references and actually check src/.
      - run: npx tsc -b --noEmit
      - run: npm run build
